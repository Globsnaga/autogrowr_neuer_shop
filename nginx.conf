# nginx-Konfiguration für die Auslieferung der Vite/React-SPA.
# try_files sorgt dafür, dass client-seitiges Routing (react-router-dom)
# auch bei Direktaufrufen/Reloads auf Unterseiten funktioniert.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|webp|woff2?|ttf|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
